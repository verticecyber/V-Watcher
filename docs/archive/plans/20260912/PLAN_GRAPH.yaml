    label: Fusion claim
    statement: one decision path with one case authority and preserved fallback under L2
    claim_ceiling: L2 integration only; no perf claim
    limitations:
      - trace-sequence comparison only

  - id: C-05
    kind: CLAIM
    label: UI truth claim
    statement: listed UI strings are backend-bound or reworded with per-string tests under L2
    claim_ceiling: L2 binding only; no store-copy claim
    limitations:
      - semantics assertions not screenshots

  - id: C-06
    kind: CLAIM
    label: Device observation claim
    statement: Nano states latency quota and device posture recorded with named unblock evidence for gaps
    claim_ceiling: device observations only; no submission claim
    limitations:
      - hardware-dependent; likely partial

  - id: EXT-DEVICE
    kind: EXTERNAL_DEPENDENCY
    label: Physical Android device access
    owner: human-operator
    blocked_condition_oracle_ref: T-ENTRY-DEVICE
    unblock_oracle_ref: T-ENTRY-DEVICE
    freshness_rule: INVALIDATE_IF_DEVICE_FINGERPRINT_CHANGES
